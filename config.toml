baseURL = "https://ev1lm0rty.com/"
title = "ev1lm0rty"
theme = "hugo-blog-awesome"
copyright = "Shubham Arya"

locale = "en-us"
defaultContentLanguage = "en-us"
enableEmoji = true
enableRobotsTXT = true
ignoreErrors = ["additional-script-loading-error"]

# Publish directory kept as docs/ so GitHub Pages continues to serve it.
publishDir = "docs"

[markup]
  [markup.highlight]
    noClasses = false
    style = "dracula"
    codeFences = true
    guessSyntax = true
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[[menu.main]]
  pageRef = "/"
  name    = "Home"
  url     = "/"
  weight  = 10

[[menu.main]]
  pageRef = "posts"
  name    = "Posts"
  url     = "/posts/"
  weight  = 20

[[menu.main]]
  pageRef = "tags"
  name    = "Tags"
  url     = "/tags/"
  weight  = 30

[params]
  sitename        = "ev1lm0rty"
  defaultColor    = "dark"
  description     = "Shubham Arya (ev1lm0rty) — InfoSec geek, CTF player, and lover of automating boring stuff."
  mainSections    = ["posts"]
  toc             = true
  tocOpen         = false
  goToTop         = true
  dateFormat      = "2 Jan, 2006"
  rssFeedDescription = "summary"

  [params.author]
    intro       = "ev1lm0rty"
    name        = "Shubham Arya"
    description = "Product security engineer. When I'm not working, I'm usually deep in a book, at a chess board, or somewhere on a trek. This site collects whatever I feel like sharing — if any of it saves you time, [buy me a beer](https://buymeacoffee.com/ev1lm0rty) 🍺"
    avatar = "avatar.png"

  [params.webmanifest]
    theme_color      = "#131418"
    background_color = "#131418"
    display          = "standalone"

  [params.browserconfig]
    TileColor = "#131418"

